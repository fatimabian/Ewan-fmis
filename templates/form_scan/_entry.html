{% load static %}
{# Scan & Auto-Fill entry point shown at the top of a create form. Needs scan_target and scan_farmer. #}
<link rel="stylesheet" href="{% static 'css/scan-gis.css' %}">
<section class="panel sg-entry" aria-labelledby="scanEntryTitle">
  <form method="post" action="{% url 'form_scan:upload' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="hidden" name="target" value="{{ scan_target }}">
    <input type="hidden" name="farmer" value="{{ scan_farmer }}">
    <div class="sg-entry-text">
      <strong id="scanEntryTitle"><i class="bi bi-camera"></i> Have the paper form?</strong>
      <span>Take or choose a photo. The values are read, checked and entered below for you to confirm.</span>
    </div>
    <div class="sg-entry-actions">
      <input type="file" name="photo" accept="image/jpeg,image/png,image/webp" capture="environment" required aria-label="Photo of the paper form">
      <button class="btn btn-outline-success" type="submit"><i class="bi bi-upload"></i> Scan &amp; Auto-Fill</button>
    </div>
  </form>
</section>
