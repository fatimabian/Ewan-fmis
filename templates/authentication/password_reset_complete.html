{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Password Updated | FMIS</title>
    <link rel="icon" type="image/png" href="{% static 'images/brand/fmis-logo.png' %}">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="stylesheet" href="{% static 'css/typography.css' %}">
    <link rel="stylesheet" href="{% static 'css/shape-system.css' %}?v=7">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      {% include "shared/brand_logo.html" with logo_class="auth-card-brand" %}
      <div class="auth-card-icon">
        <i class="bi bi-check-lg">
        </i>
      </div>
      <h1>Password updated</h1>
      <p>Your FMIS password was changed successfully. You can now sign in with the new password.</p>
      <div class="auth-card-actions">
        <a href="{% url 'authentication:landing' %}#landingSignIn">Continue to Sign In</a>
      </div>
    </main>
  </body>
</html>
