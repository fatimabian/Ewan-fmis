<nav class="fmis-pagination" aria-label="Table pages">
  <form class="fmis-page-size" method="get" aria-label="Rows per page">
    {% for name, value in preserved_fields %}
      {% if name != 'per_page' %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endif %}
    {% endfor %}
    <label for="fmisPageSize">Rows per page:</label>
    <select id="fmisPageSize" name="per_page" onchange="this.form.submit()">
      {% for size in page_size_choices %}
        <option value="{{ size }}"{% if page_size == size %} selected{% endif %}>{{ size }}</option>
      {% endfor %}
    </select>
  </form>
  {% if page_obj.has_previous %}
    <a class="fmis-page-button"
       href="?{% if preserved_query %}{{ preserved_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}"
       aria-label="Previous page">&lsaquo;</a>
  {% else %}
    <span class="fmis-page-button is-disabled" aria-hidden="true">&lsaquo;</span>
  {% endif %}

  <form class="fmis-page-jump" method="get" title="Type a page number and press Enter">
    {% for name, value in preserved_fields %}
      <input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}
    <label class="fmis-page-label" for="fmisPageJump">Page</label>
    <input id="fmisPageJump"
           class="fmis-page-input"
           type="number"
           name="page"
           value="{{ page_obj.number }}"
           min="1"
           max="{{ page_obj.paginator.num_pages }}"
           inputmode="numeric"
           aria-label="Current page. Type a page number and press Enter."
           onchange="this.form.requestSubmit()">
    <span class="fmis-page-total">of {{ page_obj.paginator.num_pages }}</span>
  </form>

  {% if page_obj.has_next %}
    <a class="fmis-page-button"
       href="?{% if preserved_query %}{{ preserved_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}"
       aria-label="Next page">&rsaquo;</a>
  {% else %}
    <span class="fmis-page-button is-disabled" aria-hidden="true">&rsaquo;</span>
  {% endif %}
</nav>
