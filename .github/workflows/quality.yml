name: FMIS quality gate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Install application dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Run automated suite
        run: python manage.py test --settings=config.settings_test
      - name: Run production security checks
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-only-security-check-secret-key-with-more-than-fifty-characters"
          DJANGO_ALLOWED_HOSTS: "fmis.example.gov.ph"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://fmis.example.gov.ph"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DB_ENGINE: "mysql"
          MYSQL_DATABASE: "fmis_ci_check"
          MYSQL_USER: "fmis_ci_check"
          MYSQL_PASSWORD: "ci-check-only"
          MYSQL_HOST: "127.0.0.1"
          EMAIL_HOST: "smtp.example.invalid"
        run: python manage.py check --deploy
